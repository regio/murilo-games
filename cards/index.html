const W = canvas.width  = 800;
const H = canvas.height = 600;

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));
fitCanvas();

// ── Utilities ────────────────────────────────────────────────────────────────
function inRect(px,py,x,y,w,h) { return px>=x&&px<=x+w&&py>=y&&py<=y+h; }
function inBtn(x,y,w,h) { return inRect(clickX,clickY,x,y,w,h); }

function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawBtn(label,x,y,w,h,base='#0066bb',hov='#0099ee') {
  ctx.fillStyle = inRect(mouseX,mouseY,x,y,w,h) ? hov : base;
  rr(x,y,w,h,8); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(label, x+w/2, y+h/2+5);
}

function menuBg() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0a1a'); g.addColorStop(1,'#0d1020');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<80;i++){ctx.beginPath();ctx.arc((i*137.5)%W,(i*89.3)%H,0.8,0,Math.PI*2);ctx.fill();}
}

function seededRand(seed) {
  let s = seed>>>0;
  return ()=>{ s=(Math.imul(1664525,s)+1013904223)>>>0; return s/4294967296; };
}

function cardById(id) { return CARDS.find(c=>c.id===id)||null; }

// ── Card rendering ───────────────────────────────────────────────────────────
function drawCardSmall(card, x, y, w, h, inDeck=false) {
  if (!card) {
    ctx.strokeStyle='#334'; ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    rr(x,y,w,h,6); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#334'; ctx.font=`10px Courier New`;
    ctx.textAlign='center';
    ctx.fillText('drag here', x+w/2, y+h*0.55);
    return;
  }
  const isAir = card.id==='air';
  ctx.save();
  if (isAir) ctx.globalAlpha=0.4;

  ctx.fillStyle = RBG[card.rarity]||'#0e0e0e';
  rr(x,y,w,h,6); ctx.fill();

  ctx.strokeStyle = inDeck ? '#00ff88' : (RCOL[card.rarity]||'#555');
  ctx.lineWidth   = inDeck ? 2 : 1.2;
  rr(x,y,w,h,6); ctx.stroke();
  ctx.lineWidth=1;

  const efs = Math.floor(h*0.30);
  ctx.font = `${efs}px serif`;
  ctx.textAlign='center';
  ctx.fillText(card.emoji, x+w/2, y+h*0.40);

  const fs = Math.max(7, Math.floor(h*0.13));
  ctx.fillStyle='#ddeeff'; ctx.font=`bold ${fs}px Courier New`;
  ctx.textAlign='center';
  const nm = card.name.length>13?card.name.slice(0,12)+'…':card.name;
  ctx.fillText(nm, x+w/2, y+h*0.60);

  const sf = Math.max(7, Math.floor(h*0.11));
  ctx.font=`${sf}px Courier New`;
  ctx.fillStyle='#cc5555'; ctx.textAlign='left';
  ctx.fillText(`♥${card.hp}`, x+5, y+h*0.77);
  ctx.fillStyle='#ffaa33'; ctx.textAlign='right';
  ctx.fillText(`⚔${card.dmg}`, x+w-5, y+h*0.77);

  ctx.fillStyle=RCOL[card.rarity]||'#555';
  ctx.beginPath(); ctx.arc(x+w-7,y+7,4,0,Math.PI*2); ctx.fill();

  if (w>180) {
    // Show move names in deck slot view
    ctx.fillStyle='#4a6677'; ctx.font=`${Math.max(7,Math.floor(h*0.095))}px Courier New`;
    ctx.textAlign='left';
    if (card.move1) ctx.fillText(card.move1.name, x+6, y+h*0.88);
    ctx.textAlign='right';
    if (card.move2) ctx.fillText(card.move2.name, x+w-6, y+h*0.88);
  }

  if (isAir) {
    ctx.globalAlpha=0.9; ctx.strokeStyle='#ff4444'; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(x+10,y+10); ctx.lineTo(x+w-10,y+h-10);
    ctx.moveTo(x+w-10,y+10); ctx.lineTo(x+10,y+h-10);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCardFull(card, x, y, w=140, h=162) {
  if (!card) return;
  ctx.save();
  const col = RCOL[card.rarity]||'#555';
  ctx.fillStyle = RBG[card.rarity]||'#0e0e0e';
  rr(x,y,w,h,8); ctx.fill();
  if (card.rarity==='mythic') { ctx.shadowColor=col; ctx.shadowBlur=14; }
  ctx.strokeStyle=col; ctx.lineWidth=2;
  rr(x,y,w,h,8); ctx.stroke();
  ctx.shadowBlur=0; ctx.lineWidth=1;

  ctx.font='36px serif'; ctx.textAlign='center';
  ctx.fillText(card.emoji, x+w/2, y+50);

  ctx.fillStyle='#eeeeff'; ctx.font='bold 11px Courier New';
  ctx.textAlign='center';
  const nm = card.name.length>14?card.name.slice(0,13)+'…':card.name;
  ctx.fillText(nm, x+w/2, y+68);

  ctx.fillStyle=col; ctx.font='8px Courier New';
  ctx.fillText(card.rarity.toUpperCase(), x+w/2, y+80);

  // HP bar
  if (card.currentHp !== undefined) {
    const ratio = Math.max(0, card.currentHp/card.hp);
    const bx=x+8, by=y+86, bw=w-16, bh=7;
    ctx.fillStyle='#222'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle = ratio>0.5?'#44cc44':ratio>0.25?'#ccaa00':'#cc3333';
    ctx.fillRect(bx,by,bw*ratio,bh);
    ctx.strokeStyle='#444'; ctx.lineWidth=0.5;
    ctx.strokeRect(bx,by,bw,bh); ctx.lineWidth=1;
    ctx.fillStyle='#ccc'; ctx.font='8px Courier New'; ctx.textAlign='center';
    ctx.fillText(`${card.currentHp}/${card.hp}`, x+w/2, by+bh+10);
  }

  // Status badges
  let sx=x+4; const sy2=y+110;
  ctx.font='9px serif';
  if (card.burnStack&&card.burnStack.turns>0){ctx.fillStyle='#ff6600';ctx.textAlign='left';ctx.fillText(`🔥×${card.burnStack.turns}`,sx,sy2);sx+=26;}
  if (card.buffDmgTurns>0){ctx.fillStyle='#ffdd44';ctx.textAlign='left';ctx.fillText(`⬆×${card.buffDmgTurns}`,sx,sy2);sx+=26;}
  if (card.buffHpTurns>0){ctx.fillStyle='#44aaff';ctx.textAlign='left';ctx.fillText(`🛡×${card.buffHpTurns}`,sx,sy2);}

  // Move names
  ctx.fillStyle='#4a6677'; ctx.font='8px Courier New';
  ctx.textAlign='left';
  if (card.move1) ctx.fillText(card.move1.name, x+4, y+h-20);
  ctx.textAlign='right';
  if (card.move2) ctx.fillText(card.move2.name, x+w-4, y+h-20);
  ctx.textAlign='left';
  ctx.restore();
}

// ── Pack rolling ─────────────────────────────────────────────────────────────
function rollCardFromPack(packId) {
  const pack = PACKS[packId];
  const ws = pack.weights;
  const total = Object.values(ws).reduce((a,b)=>a+b,0);
  let r = Math.random()*total, chosen='common';
  for (const [rar,wt] of Object.entries(ws)) { r-=wt; if(r<=0){chosen=rar;break;} }
  if (chosen==='air') return cardById('air');

  let pool;
  if (packId==='mythic') {
    pool = chosen==='mythic'
      ? CARDS.filter(c=>c.rarity==='mythic')
      : CARDS.filter(c=>c.rarity===chosen&&c.id!=='air');
  } else {
    pool = CARDS.filter(c=>c.pack===packId&&c.rarity===chosen);
  }
  if (!pool.length) pool = CARDS.filter(c=>c.pack===packId&&c.rarity==='common');
  return pool[Math.floor(Math.random()*pool.length)] || cardById('air');
}

// ── Enemy deck generation ────────────────────────────────────────────────────
function buildEnemyDeck(level) {
  const rand = seededRand(0xCAFE0000+level);
  const rarities = level<=20  ? ['common','uncommon'] :
                   level<=50  ? ['common','uncommon','rare'] :
                   level<=80  ? ['common','uncommon','rare','epic'] :
                                ['uncommon','rare','epic','mythic'];
  const pool = CARDS.filter(c=>rarities.includes(c.rarity)&&c.id!=='air');
  const size = Math.min(5, 2+Math.floor(level/25));
  const deck = [];
  for(let i=0;i<size;i++) deck.push(pool[Math.floor(rand()*pool.length)].id);
  return deck;
}

// ── Battle card factory ──────────────────────────────────────────────────────
let _bid = 0;
function makeBattleCard(def) {
  if (!def) return null;
  return { ...def, currentHp:def.hp, buffDmgMult:1, buffDmgTurns:0,
           buffHpReduct:0, buffHpTurns:0, burnStack:null, bid:++_bid };
}

// ── Battle logic ─────────────────────────────────────────────────────────────
function addLog(msg) {
  if (!battle) return;
  battle.log.unshift(msg);
  if (battle.log.length>4) battle.log.pop();
}

function applyMove(move, atk, def) {
  if (!atk||!def||!move) return;
  const mult   = atk.buffDmgMult||1;
  const reduce = def.buffHpReduct||0;
  switch(move.type) {
    case 'attack': {
      const d=Math.max(1,Math.floor(atk.dmg*move.value*mult*(1-reduce)));
      def.currentHp=Math.max(0,def.currentHp-d);
      addLog(`${atk.name}: ${move.name} — ${d} dmg`);
      break;
    }
    case 'double_hit': {
      const d=Math.max(1,Math.floor(move.value*mult*(1-reduce)));
      def.currentHp=Math.max(0,def.currentHp-d*2);
      addLog(`${atk.name}: ${move.name} — ${d}+${d} dmg`);
      break;
    }
    case 'heal': {
      const h=Math.max(1,Math.floor(atk.hp*move.value/100));
      atk.currentHp=Math.min(atk.hp,atk.currentHp+h);
      addLog(`${atk.name}: ${move.name} — healed ${h} HP`);
      break;
    }
    case 'buff_dmg': {
      atk.buffDmgMult=1+move.value/100; atk.buffDmgTurns=2;
      addLog(`${atk.name}: ${move.name} — attack up!`);
      break;
    }
    case 'buff_hp': {
      atk.buffHpReduct=move.value/100; atk.buffHpTurns=2;
      addLog(`${atk.name}: ${move.name} — defense up!`);
      break;
    }
    case 'burn': {
      def.burnStack={dmgPct:8,turns:2};
      addLog(`${atk.name}: ${move.name} — ${def.name} is burning!`);
      break;
    }
    case 'life_steal': {
      const d=Math.max(1,Math.floor(atk.dmg*move.value*mult));
      def.currentHp=Math.max(0,def.currentHp-d);
      const h=Math.floor(d*0.3);
      atk.currentHp=Math.min(atk.hp,atk.currentHp+h);
      addLog(`${atk.name}: ${move.name} — ${d} dmg, +${h} HP`);
      break;
    }
    case 'debuff': {
      def.buffDmgMult=1; def.buffDmgTurns=0;
      def.buffHpReduct=0; def.buffHpTurns=0;
      addLog(`${atk.name}: ${move.name} — ${def.name}'s buffs cleared!`);
      break;
    }
    case 'revive': {
      addLog(`${atk.name}: ${move.name} prepared...`);
      break;
    }
    default:
      addLog(`${atk.name}: ${move.name}`);
  }
}

function tickStatus(card) {
  if (!card) return;
  if (card.burnStack&&card.burnStack.turns>0) {
    const d=Math.max(1,Math.floor(card.hp*card.burnStack.dmgPct/100));
    card.currentHp=Math.max(0,card.currentHp-d);
    card.burnStack.turns--;
    addLog(`${card.name} burns for ${d}`);
    if(card.burnStack.turns<=0) card.burnStack=null;
  }
  if(card.buffDmgTurns>0&&--card.buffDmgTurns===0) card.buffDmgMult=1;
  if(card.buffHpTurns>0&&--card.buffHpTurns===0)   card.buffHpReduct=0;
}

function checkDeaths() {
  if (!battle) return false;
  for (const side of ['player','enemy']) {
    const active = battle[side+'Active'];
    const deck   = battle[side+'Deck'];
    for(let i=active.length-1;i>=0;i--) {
      const c=active[i];
      if(c.currentHp<=0) {
        if(c.id==='m05'&&!reviveUsed[c.bid]) {
          reviveUsed[c.bid]=true;
          c.currentHp=Math.floor(c.hp*0.4);
          c.burnStack=null;
          addLog(`${c.name} rises from the ashes!`);
          continue;
        }
        active.splice(i,1);
        addLog(`${c.name} has fallen!`);
        if(deck.length>0){const nxt=deck.shift();active.push(nxt);addLog(`${nxt.name} enters!`);}
      }
    }
    if(active.length===0&&deck.length===0){endBattle(side==='enemy');return true;}
  }
  return false;
}

function enemyAI(enemy, target) {
  if(!enemy||!target) return enemy&&enemy.move1;
  const ratio=enemy.currentHp/enemy.hp;
  const moves=[enemy.move1,enemy.move2];
  if(ratio<0.4){const d=moves.find(m=>m.type==='heal'||m.type==='buff_hp');if(d)return d;}
  const off=moves.find(m=>['attack','double_hit','burn','life_steal'].includes(m.type));
  return off||moves[0];
}

function doEnemyTurn() {
  if(!battle) return;
  const allEnemies=[...battle.enemyActive];
  for(let ei=0;ei<allEnemies.length;ei++) {
    const ec=allEnemies[ei];
    if(!ec||ec.currentHp<=0) continue;
    const pt=battle.playerActive[Math.min(ei,battle.playerActive.length-1)];
    if(!pt) continue;
    const em=enemyAI(ec,pt);
    applyMove(em,ec,pt);
    tickStatus(ec); tickStatus(pt);
    if(checkDeaths()) return;
  }
}

function resolveRound(moveIdx) {
  if(!battle) return;
  const pCard = battle.playerActive[battle.activePlayerIdx];
  if(!pCard) return;
  const eIdx  = battle.twoCard ? Math.min(battle.activePlayerIdx, battle.enemyActive.length-1) : 0;
  const eCard = battle.enemyActive[eIdx];
  if(!eCard) return;

  const pMove = moveIdx===0 ? pCard.move1 : pCard.move2;
  applyMove(pMove, pCard, eCard);
  tickStatus(pCard); tickStatus(eCard);
  if(checkDeaths()) return;

  if(battle.twoCard && battle.playerActive.length>1 && battle.activePlayerIdx===0) {
    battle.activePlayerIdx=1;
    return;
  }
  battle.activePlayerIdx=0;
  doEnemyTurn();
}

function doSwitch(deckIdx) {
  if(!battle||deckIdx>=battle.playerDeck.length) return;
  const newCard = battle.playerDeck.splice(deckIdx,1)[0];
  const oldCard = battle.playerActive[battle.activePlayerIdx];
  battle.playerActive[battle.activePlayerIdx] = newCard;
  battle.playerDeck.push(oldCard);
  addLog(`You switched to ${newCard.name}!`);
  battle.switching = false;
  if(battle.twoCard && battle.playerActive.length>1 && battle.activePlayerIdx===0) {
    battle.activePlayerIdx=1;
  } else {
    battle.activePlayerIdx=0;
  }
}

function isBattleImpossible(levelIdx) {
  const pCards = save.deck.map(id=>cardById(id)).filter(Boolean);
  const eDefs  = buildEnemyDeck(levelIdx+1).map(id=>cardById(id)).filter(Boolean);
  if(!pCards.length||!eDefs.length) return false;
  const pDmg = pCards.reduce((s,c)=>s+c.dmg,0);
  const pHp  = pCards.reduce((s,c)=>s+c.hp, 0);
  const eDmg = eDefs.reduce((s,c)=>s+c.dmg,0);
  const eHp  = eDefs.reduce((s,c)=>s+c.hp, 0);
  const pTTK = Math.ceil(eHp / Math.max(1,pDmg));
  const eTTK = Math.ceil(pHp / Math.max(1,eDmg));
  return pTTK > eTTK;
}

function endBattle(won) {
  const reward = won ? Math.floor(25+battle.level*3) : 0;
  if(won) {
    save.money+=reward;
    if(battle.level>=save.highestLevel) save.highestLevel=battle.level+1;
    persist();
  }
  battleResult={won,moneyEarned:reward};
  state='battle_result';
}

function startBattle(levelIdx) {
  reviveUsed={}; _bid=0;
  const twoCard=(levelIdx+1)%5===0;
  const pDeck=save.deck.map(id=>makeBattleCard(cardById(id))).filter(Boolean);
  const eDeck=buildEnemyDeck(levelIdx+1).map(id=>makeBattleCard(cardById(id))).filter(Boolean);
  battle={
    level:levelIdx, twoCard,
    playerDeck: pDeck.slice(twoCard?2:1),
    enemyDeck:  eDeck.slice(twoCard?2:1),
    playerActive: twoCard?pDeck.slice(0,2):[pDeck[0]].filter(Boolean),
    enemyActive:  twoCard?eDeck.slice(0,2):[eDeck[0]].filter(Boolean),
    activePlayerIdx:0,
    switching:false,
    log:['Battle start!','','',''],
  };
  battleResult=null;
  state='battle';
}

function redeemCode(code) {
  switch(code.toLowerCase().trim()) {
    case 'allan': {
      const allIds = CARDS.filter(c=>c.id!=='air').map(c=>c.id);
      const existing = new Set(save.cards);
      allIds.forEach(id=>{ if(!existing.has(id)) save.cards.push(id); });
      persist();
      codeMsg = '✅ You got every card!';
      break;
    }
    case 'allanno': {
      const unique = [...new Set(save.cards)];
      save.cards = unique;
      save.deck = save.deck.filter(id=>save.cards.includes(id));

    ctx.fillStyle=canSwitch?(sh?'#1a3a1a':'#0d1f0d'):'#111';
    rr(300,572,200,24,6); ctx.fill();
    ctx.strokeStyle=canSwitch?(sh?'#44cc44':'#224422'):'#222';
    ctx.lineWidth=1; rr(300,572,200,24,6); ctx.stroke();
    ctx.fillStyle=canSwitch?'#66dd66':'#445544'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText(canSwitch?'↔ SWITCH CARD':'↔ SWITCH (no cards)', 400, 588);
    if(clicked){
      if(inRect(clickX,clickY,10,500,375,64))  resolveRound(0);
      if(inRect(clickX,clickY,415,500,375,64)) resolveRound(1);
      if(inRect(clickX,clickY,300,572,200,24)&&canSwitch) battle.switching=true;
    }
  }

  // Switching overlay
  if(battle.switching) {
    ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,294,W,306);
    ctx.fillStyle='#aaccff'; ctx.font='bold 14px Courier New'; ctx.textAlign='center';
    ctx.fillText('SWITCH TO:', W/2, 318);
    const deck=battle.playerDeck;
    const cardW=140,cardH=90,gap=12;
    const totalW=deck.length*(cardW+gap)-gap;
    let sx=(W-totalW)/2;
    deck.forEach((c,i)=>{
      drawCardSmall(c,sx,328,cardW,cardH);
      if(inRect(mouseX,mouseY,sx,328,cardW,cardH)){ctx.strokeStyle='#00ff88';ctx.lineWidth=2;rr(sx,328,cardW,cardH,6);ctx.stroke();ctx.lineWidth=1;}
      if(clicked&&inRect(clickX,clickY,sx,328,cardW,cardH)) doSwitch(i);
      sx+=cardW+gap;
    });
    drawBtn('CANCEL',330,432,140,28,'#331111','#551111');
    if(clicked&&inBtn(330,432,140,28)) battle.switching=false;
  }
}

function drawBattleResult() {
  menuBg();
  if(!battleResult){state='levelselect';return;}
  ctx.save();
  ctx.font='bold 50px Courier New'; ctx.textAlign='center';
  const tg=ctx.createLinearGradient(0,170,0,230);
  if(battleResult.won){tg.addColorStop(0,'#00ff88');tg.addColorStop(1,'#00aaff');}
  else{tg.addColorStop(0,'#ff4444');tg.addColorStop(1,'#cc1111');}
  ctx.fillStyle=tg; ctx.fillText(battleResult.won?'VICTORY!':'DEFEATED',W/2,210);
  ctx.restore();

  ctx.textAlign='center';
  if(battleResult.won){
    ctx.fillStyle='#aabbcc'; ctx.font='16px Courier New';
    ctx.fillText(`Level ${battle.level+1} cleared!`,W/2,262);
    ctx.fillStyle='#ffcc00'; ctx.font='bold 18px Courier New';
    ctx.fillText(`+$${battleResult.moneyEarned}`,W/2,294);
    ctx.fillStyle='#557788'; ctx.font='12px Courier New';
    ctx.fillText(`Total: $${save.money}`,W/2,322);
    drawBtn('CONTINUE',300,365,200,50,'#005533','#008855');
    if(clicked&&inBtn(300,365,200,50)) state='levelselect';
  } else {
    ctx.fillStyle='#aabbcc'; ctx.font='15px Courier New';
    ctx.fillText('You ran out of cards.',W/2,265);
    ctx.fillStyle='#667788'; ctx.font='12px Courier New';
    ctx.fillText('Buy packs in SHOP, or rebuild deck in BUILD.',W/2,295);

    drawBtn('RETRY',185,365,160,50,'#550000','#880000');
    drawBtn('MENU', 455,365,160,50,'#222','#444');
    if(clicked){
      if(inBtn(185,365,160,50)) startBattle(battle.level);
      if(inBtn(455,365,160,50)) state='menu';
    }
    ctx.fillStyle='rgba(0,0,0,0.55)'; rr(120,430,560,56,10); ctx.fill();
    ctx.strokeStyle='#886600'; ctx.lineWidth=1.5; rr(120,430,560,56,10); ctx.stroke(); ctx.lineWidth=1;
    ctx.fillStyle='#ffcc44'; ctx.font='bold 13px Courier New'; ctx.textAlign='center';
    ctx.fillText('Would you like help? (+$200 to spend on packs)', W/2, 452);
    ctx.fillStyle='#aa8800'; ctx.font='11px Courier New';
    ctx.fillText('Free money — no strings attached', W/2, 468);
    drawBtn('YES (+$200)',145,492,200,40,'#554400','#886600');
    drawBtn('NO THANKS', 455,492,200,40,'#222','#444');
    if(clicked){
      if(inBtn(145,492,200,40)){save.money+=200;persist();showNotif('+$200 added!');battleResult=null;state='menu';}
      if(inBtn(455,492,200,40)){battleResult=null;state='menu';}
    }
  }
}

// ── Input ────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
  mouseY=(e.clientY-r.top)*(H/r.height);
  if(drag){dragX=mouseX;dragY=mouseY;}
});
canvas.addEventListener('click', e=>{
  const r=canvas.getBoundingClientRect();
  clicked=true;
  clickX=(e.clientX-r.left)*(W/r.width);
  clickY=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  if(state==='build'&&mouseX<490){
    const uid=[...new Set(save.cards)];
    const maxS=Math.max(0,Math.ceil(uid.length/4)*96-500);
    buildScroll=Math.max(0,Math.min(maxS,buildScroll+e.deltaY*0.5));
  }
},{passive:false});

// Code input
const codeEl = document.getElementById('codeEl');
codeEl.addEventListener('input', ()=>{
  codeInput = codeEl.value.slice(0,24);
  codeMsg = '';
});
codeEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){redeemCode(codeInput);codeInput='';codeEl.value='';e.preventDefault();}
});
window.addEventListener('keydown', e=>{
  if(state!=='codes') return;
  if(e.key==='Backspace'){codeInput=codeInput.slice(0,-1);codeMsg='';codeEl.value=codeInput;}
  else if(e.key==='Enter'){redeemCode(codeInput);codeInput='';codeEl.value='';}
  else if(e.key.length===1&&codeInput.length<24){codeInput+=e.key;codeMsg='';codeEl.value=codeInput;}
});
function enterCodes(){codeInput='';codeMsg='';codeEl.value='';codeEl.style.pointerEvents='auto';codeEl.focus();state='codes';}
function exitCodes(){codeEl.style.pointerEvents='none';codeEl.blur();state='menu';}

// Drag
canvas.addEventListener('mousedown', e=>{
  if(state!=='build') return;
  const r=canvas.getBoundingClientRect();
  const px=(e.clientX-r.left)*(W/r.width), py=(e.clientY-r.top)*(H/r.height);
  initDrag(px,py);
});
canvas.addEventListener('mouseup', e=>{
  if(!drag) return;
  const r=canvas.getBoundingClientRect();
  resolveDrop((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
  drag=null;
});

function initDrag(px,py){
  const uid=[...new Set(save.cards)];
  const cW=110,cH=90,cGap=6,cols=4;
  for(let i=0;i<uid.length;i++){
    const col=i%cols,row=Math.floor(i/cols);
    const cx2=10+col*(cW+cGap),cy2=66+row*(cH+cGap)-buildScroll;
    if(inRect(px,py,cx2,cy2,cW,cH)){
      drag={cardId:uid[i],fromArea:'collection',fromIndex:i,snapX:cx2,snapY:cy2};
      dragX=px;dragY=py;return;
    }
  }
  const sX=505,sW=285,sH=92,sGap=6;
  for(let i=0;i<5;i++){
    const sy=66+i*(sH+sGap);
    if(save.deck[i]&&inRect(px,py,sX,sy,sW,sH)){
      drag={cardId:save.deck[i],fromArea:'deck',fromIndex:i,snapX:sX,snapY:sy};
      dragX=px;dragY=py;return;
    }
  }
}

function resolveDrop(px,py){
  if(!drag) return;
  const {cardId,fromArea,fromIndex}=drag;
  const card=cardById(cardId);
  if(!card) return;

  if(px>=495){
    const sX=505,sW=285,sH=92,sGap=6;
    let dropped=false;
    for(let i=0;i<5;i++){
      const sy=66+i*(sH+sGap);
      if(inRect(px,py,sX,sy,sW,sH)){
        if(cardId==='air'){showNotif("Air cards can't go in your deck!");return;}
        if(fromArea==='deck'){
          if(fromIndex!==i){
            const tmp=save.deck[i];
            save.deck[i]=save.deck[fromIndex];
            if(tmp!==undefined) save.deck[fromIndex]=tmp;
            else save.deck.splice(fromIndex,1);
          }
        } else {
          if(save.deck.includes(cardId)){showNotif('Already in deck!');return;}
          if(save.deck[i]){save.deck[i]=cardId;}
          else{
            // fill at position i
            while(save.deck.length<=i) save.deck.push(undefined);
            save.deck[i]=cardId;
            save.deck=save.deck.filter(x=>x!==undefined);
          }
        }
        persist();dropped=true;break;
      }
    }
    if(!dropped&&fromArea==='collection'){
      if(cardId==='air'){showNotif("Air cards can't go in your deck!");return;}
      if(save.deck.includes(cardId)){showNotif('Already in deck!');return;}
      if(save.deck.length>=5){showNotif('Deck full! (5 max)');return;}
      save.deck.push(cardId);persist();
    }
  } else if(px<490&&fromArea==='deck'){
    save.deck.splice(fromIndex,1);persist();
  }
}

// Touch
let tStartX=0,tStartY=0,tLastX=0,tLastY=0,tMoved=false;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  const tx=(t.clientX-r.left)*(W/r.width),ty=(t.clientY-r.top)*(H/r.height);
  tStartX=tLastX=tx;tStartY=tLastY=ty;tMoved=false;
  mouseX=tx;mouseY=ty;
  if(state==='build') initDrag(tx,ty);
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  const tx=(t.clientX-r.left)*(W/r.width),ty=(t.clientY-r.top)*(H/r.height);
  mouseX=tx;mouseY=ty;
  if(drag){dragX=tx;dragY=ty;}
  else if(state==='build'&&tx<490){
    const uid=[...new Set(save.cards)];
    const maxS=Math.max(0,Math.ceil(uid.length/4)*96-500);
    buildScroll=Math.max(0,Math.min(maxS,buildScroll+(tLastY-ty)));
  }
  tLastX=tx;tLastY=ty;
  if(Math.abs(tx-tStartX)>18||Math.abs(ty-tStartY)>18) tMoved=true;
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(drag&&state==='build'){resolveDrop(tLastX,tLastY);drag=null;return;}
  drag=null;
  if(!tMoved){
    clicked=true;clickX=tLastX;clickY=tLastY;
    if(state==='codes') codeEl.focus();
  }
},{passive:false});

// ── Main loop ────────────────────────────────────────────────────────────────
function loop(){
  ctx.clearRect(0,0,W,H);
  switch(state){
    case 'mobilecheck':   drawMobileCheck();   break;
    case 'menu':          drawMenu();          break;
    case 'shop':          drawShop();          break;
    case 'packopen':      drawPackOpen();      break;
    case 'build':         drawBuild();         break;
    case 'levelselect':   drawLevelSelect();   break;
    case 'battle':        drawBattle();        break;
    case 'battle_result': drawBattleResult();  break;
    case 'codes':         drawCodes();         break;
  }
  // Particles
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.91;p.vy*=0.91;p.life-=0.04;
    if(p.life>0){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();}
  }
  particles.splice(0,particles.length,...particles.filter(p=>p.life>0));
  clicked=false;
  requestAnimationFrame(loop);
}
loop();
</script>
